      - { type: role, text: "IT Intern", date: "Jun 2024 – Aug 2024; Jun 2025 – Aug 2025" }
      - { type: org, text: "Lynx Equity Limited" }
      - type: bullets
        items:
          - "Built a task management system on Monday.com that routed issues to the right workflow queue across subsidiaries and internal departments."
